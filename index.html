<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ひとつの文を縦書きで並べるサイト。">
  <title>kakidashi</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf6;
      --ink: #171717;
      --muted: #76716a;
      --line: rgba(23, 23, 23, 0.13);
      --accent: #8c2f22;
    }

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: var(--paper);
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(140, 47, 34, 0.05), transparent 28rem),
        var(--paper);
      font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Noto Serif JP", serif;
      overflow-x: hidden;
    }

    @supports (overflow: clip) {
      html,
      body {
        overflow-x: clip;
      }
    }

    .page {
      width: min(100%, 1120px);
      max-width: 100%;
      min-height: 100vh;
      margin: 0 auto;
      padding: calc(48px + clamp(14px, 3vw, 34px)) clamp(18px, 4vw, 48px) clamp(18px, 4vw, 48px);
      overflow-x: hidden;
    }

    .site-head {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      border-bottom: 1px solid var(--line);
      background: rgba(251, 250, 246, 0.88);
      backdrop-filter: blur(12px);
    }

    .site-head-inner {
      width: min(100%, 1120px);
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0 clamp(18px, 4vw, 48px);
    }

    .site-title {
      margin: 0;
      font-size: clamp(1.25rem, 2.2vw, 1.6rem);
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.04em;
    }

    .sentences {
      max-width: 100%;
      position: relative;
      padding: 0 clamp(8px, 2vw, 22px);
      overflow-x: hidden;
      overflow-anchor: none;
    }

    .sentence {
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: grid;
      place-items: center;
      position: absolute;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0.38rem 0.28rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.45);
      color: inherit;
      font-size: var(--font-size, clamp(1.15rem, 1.5vw, 1.55rem));
      line-height: 1.95;
      letter-spacing: 0.07em;
      text-decoration: none;
      white-space: nowrap;
      overflow: visible;
      overscroll-behavior: none;
      overflow-anchor: none;
      opacity: 0;
      filter: blur(5px);
      transition:
        background-color 160ms ease,
        border-color 160ms ease,
        filter 520ms ease,
        opacity 520ms ease;
    }

    .sentence.is-visible {
      opacity: 1;
      filter: blur(0);
    }

    .sentence:hover,
    .sentence:focus-visible {
      border-color: rgba(23, 23, 23, 0.35);
      background: rgba(255, 255, 255, 0.8);
    }

    .sentence:focus-visible {
      outline: 2px solid rgba(140, 47, 34, 0.5);
      outline-offset: 3px;
    }

    .error {
      max-width: 42rem;
      margin: 0;
      padding: 1rem 1.1rem;
      border: 1px solid rgba(140, 47, 34, 0.32);
      background: rgba(140, 47, 34, 0.07);
      color: #6f231a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    @media (max-width: 720px) {
      .page {
        width: 100%;
        padding: 64px 14px 18px;
      }

      .site-title {
        font-size: 1.32rem;
      }

      .sentences {
        padding-inline: 0;
      }

      .sentence {
        padding: 0.32rem 0.22rem;
        font-size: var(--font-size, 1.08rem);
        line-height: 1.75;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sentence {
        filter: none;
        transition: background-color 160ms ease, border-color 160ms ease;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="site-head" aria-label="サイト名">
      <div class="site-head-inner">
        <h1 class="site-title">書き出し</h1>
      </div>
    </header>

    <section id="sentences" class="sentences" aria-label="縦書きの文章"></section>
  </main>

  <script>
    const FEED_URL = "https://masusono.com/feed.xml";
    const INITIAL_RENDER_COUNT = 80;
    const APPEND_RENDER_COUNT = 24;
    const INFINITE_SCROLL_THRESHOLD = 2600;
    const SENTENCE_END_PATTERN = /[。！？!?]+[」』）)］\]｝}”’】〕〉》〙〗〟'"]*|\n/g;

    const sentences = document.getElementById("sentences");
    let articles = [];
    let nextIndex = 0;
    let isAppending = false;
    let resizeTimer;
    let columnHeights = [];
    let columnWidth = 0;
    let columnGap = 0;
    let rowGap = 0;
    let lastLayoutWidth = 0;

    function shuffleArticles() {
      for (let index = articles.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [articles[index], articles[randomIndex]] = [articles[randomIndex], articles[index]];
      }
    }

    function createSentenceLink(article) {
      const link = document.createElement("a");
      link.className = "sentence";
      link.href = article.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = article.text;
      link.dataset.articleId = article.id;
      link.dataset.articleUrl = article.url;
      link.style.setProperty("--font-size", getFontSize(article.text.length));
      link.style.width = `${columnWidth}px`;
      link.style.visibility = "hidden";

      return link;
    }

    function appendSentences(count = articles.length) {
      const fragment = document.createDocumentFragment();
      const links = [];

      for (let index = 0; index < count; index += 1) {
        if (nextIndex > 0 && nextIndex % articles.length === 0) {
          shuffleArticles();
        }

        const article = articles[nextIndex % articles.length];
        const link = createSentenceLink(article);
        fragment.appendChild(link);
        links.push(link);
        nextIndex += 1;
      }

      sentences.appendChild(fragment);
      layoutNewSentences(links);
    }

    function appendWhenNearBottom() {
      if (isAppending) {
        return;
      }

      const distanceToBottom = document.documentElement.scrollHeight - window.innerHeight - window.scrollY;

      if (distanceToBottom > INFINITE_SCROLL_THRESHOLD) {
        return;
      }

      isAppending = true;
      window.requestAnimationFrame(() => {
        appendSentences(APPEND_RENDER_COUNT);
        isAppending = false;
      });
    }

    function getLayoutMetrics() {
      const isNarrow = window.matchMedia("(max-width: 720px)").matches;
      return {
        preferredColumnWidth: isNarrow ? 58 : 72,
        columnGap: isNarrow ? 12 : Math.min(22, Math.max(12, window.innerWidth * 0.018)),
        rowGap: isNarrow ? 12 : Math.min(22, Math.max(12, window.innerWidth * 0.018))
      };
    }

    function setupColumns() {
      const metrics = getLayoutMetrics();
      const containerWidth = sentences.clientWidth;
      const columnCount = Math.max(1, Math.floor((containerWidth + metrics.columnGap) / (metrics.preferredColumnWidth + metrics.columnGap)));

      lastLayoutWidth = containerWidth;
      columnGap = metrics.columnGap;
      rowGap = metrics.rowGap;
      columnWidth = (containerWidth - columnGap * (columnCount - 1)) / columnCount;
      columnHeights = Array.from({ length: columnCount }, () => 0);
    }

    function getShortestColumnIndex() {
      return columnHeights.indexOf(Math.min(...columnHeights));
    }

    function getRevealDelay(item) {
      if (item.classList.contains("is-visible")) {
        return "0ms";
      }

      return `${Math.floor(Math.random() * 420)}ms`;
    }

    function layoutNewSentences(items) {
      items.forEach((item) => {
        const columnIndex = getShortestColumnIndex();
        const x = columnIndex * (columnWidth + columnGap);
        const y = columnHeights[columnIndex];

        item.style.transform = `translate(${x}px, ${y}px)`;
        item.style.transitionDelay = getRevealDelay(item);
        item.style.visibility = "visible";
        columnHeights[columnIndex] += item.offsetHeight + rowGap;
      });

      sentences.style.height = `${Math.max(...columnHeights) - rowGap}px`;

      window.requestAnimationFrame(() => {
        items.forEach((item) => {
          item.classList.add("is-visible");
        });
      });
    }

    function relayoutAllSentences() {
      setupColumns();
      const items = Array.from(sentences.querySelectorAll(".sentence"));

      items.forEach((item) => {
        item.style.width = `${columnWidth}px`;
        item.style.visibility = "hidden";
        item.style.transform = "translate(0, 0)";
      });

      layoutNewSentences(items);
    }

    function handleResize() {
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        if (Math.abs(sentences.clientWidth - lastLayoutWidth) < 1) {
          appendWhenNearBottom();
          return;
        }

        relayoutAllSentences();
        appendWhenNearBottom();
      }, 120);
    }

    function getFontSize(length) {
      if (length <= 5) {
        return "1.82rem";
      }

      if (length <= 12) {
        return "1.56rem";
      }

      if (length <= 20) {
        return "1.34rem";
      }

      if (length <= 32) {
        return "1.12rem";
      }

      if (length <= 50) {
        return "0.98rem";
      }

      return "0.88rem";
    }

    function getArticleId(url) {
      return url.split("/").filter(Boolean).at(-1) || "";
    }

    function stripHtml(html) {
      const template = document.createElement("template");
      template.innerHTML = html;
      template.content.querySelectorAll("br").forEach((br) => {
        br.replaceWith("\n");
      });
      template.content.querySelectorAll("p, h1, h2, h3, h4, h5, h6, li").forEach((element) => {
        element.append("\n");
      });

      return template.content.textContent.replace(/[ \t\f\v]+/g, " ").replace(/\n{2,}/g, "\n").trim();
    }

    function getFirstSentence(text) {
      const normalizedText = text.trim();
      const sentence = findFirstSentenceEnd(normalizedText);

      if (sentence) {
        return normalizedText.slice(0, sentence.index + sentence.text.length).trim();
      }

      return normalizedText.slice(0, 80);
    }

    function findFirstSentenceEnd(text) {
      SENTENCE_END_PATTERN.lastIndex = 0;

      for (const match of text.matchAll(SENTENCE_END_PATTERN)) {
        const endText = match[0];
        const nextCharacter = text[match.index + endText.length] || "";

        if (endText === "\n" || !continuesAfterQuotedPunctuation(endText, nextCharacter)) {
          return {
            index: match.index,
            text: endText
          };
        }
      }

      return null;
    }

    function continuesAfterQuotedPunctuation(endText, nextCharacter) {
      const endsWithClosingMark = /[」』）)］\]｝}”’】〕〉》〙〗〟'"]$/.test(endText);

      return endsWithClosingMark && /^[ぁ-んァ-ヶー一-龠々〆ヵヶA-Za-z0-9]/.test(nextCharacter);
    }

    function showError(error) {
      sentences.innerHTML = "";

      const message = document.createElement("p");
      message.className = "error";
      message.textContent = `feed.xml を読み込めませんでした: ${error.message}`;
      sentences.appendChild(message);
    }

    async function loadArticles() {
      const response = await fetch(FEED_URL);

      if (!response.ok) {
        throw new Error(`Feed request failed: ${response.status}`);
      }

      const xmlText = await response.text();
      const xml = new DOMParser().parseFromString(xmlText, "application/xml");
      const parseError = xml.querySelector("parsererror");

      if (parseError) {
        throw new Error("Feed XML parse failed");
      }

      const items = Array.from(xml.querySelectorAll("item"));
      const feedArticles = items.map((item) => {
        const url = item.querySelector("link")?.textContent.trim() || "";
        const description = item.querySelector("description")?.textContent || "";

        return {
          id: getArticleId(url),
          url,
          text: getFirstSentence(stripHtml(description))
        };
      }).filter((article) => article.id && article.text);

      if (feedArticles.length === 0) {
        throw new Error("Feed has no readable articles");
      }

      articles = feedArticles;
      shuffleArticles();
    }

    async function init() {
      try {
        await loadArticles();
        setupColumns();
        appendSentences(INITIAL_RENDER_COUNT);
        appendWhenNearBottom();
        window.addEventListener("scroll", appendWhenNearBottom, { passive: true });
        window.addEventListener("resize", handleResize);
      } catch (error) {
        showError(error);
        throw error;
      }
    }

    init();
  </script>
</body>
</html>
